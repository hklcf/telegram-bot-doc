name: Update docs

on:
  schedule:
    # 每日 04:17 UTC —— 錯開整點，避免撞正流量高峰
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
# 冇 pull_request trigger：PR 由 GITHUB_TOKEN 開，觸發嘅 workflow 需要人手批准
# (action_required)。呢個 job 自己即刻 squash merge，唔使等人手 accept。

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-docs
  cancel-in-progress: false

jobs:
  update:
    # 只有定时或手動觸發先會更新；push/PR 時由 verify job 負責檢查
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Mirror docs
        run: node scripts/update.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Open PR if anything changed
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/update-docs
          delete-branch: true
          commit-message: "docs: sync Telegram Bot API documentation"
          title: "docs: sync Telegram Bot API documentation"
          labels: documentation
          body: |
            Automated mirror of the official Telegram Bot docs:
            https://core.telegram.org/bots

            - Source: <https://core.telegram.org/bots>
            - Page count: see `docs/SOURCE.json`

            Auto-merged by this workflow. The diff below is the review record.

      - name: Squash-merge and delete branch
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          # Mergeability can be briefly "unknown" just after the PR is opened.
          for i in 1 2 3 4 5; do
            gh pr merge "$PR" --squash --delete-branch && exit 0
            sleep 5
          done
          exit 1

  verify:
    # push：確認 docs/ 同官網同步，唔同步就 fail
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Re-mirror docs
        run: node scripts/update.mjs

      - name: Check docs/ is in sync
        run: |
          # 用 status 而唔係 diff，因為新加嘅頁面係 untracked，diff 睇唔到
          changes="$(git status --porcelain)"
          if [ -n "$changes" ]; then
            echo "::error::docs/ is out of date with core.telegram.org - run 'npm run update' and commit"
            echo "$changes"
            exit 1
          fi
          echo "docs/ is in sync"
